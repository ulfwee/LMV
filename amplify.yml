version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm --prefix lab6/first-app ci
    build:
      commands:
        - npm --prefix lab6/first-app run build
  artifacts:
    baseDirectory: lab6/first-app/build
    files:
      - '**/*'
  cache:
    paths:
      - lab6/first-app/node_modules/**/*